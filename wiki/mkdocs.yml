site_name: Crownfall 攻略Wiki
site_description: 2D自動探索ハクスラRPG「Crownfall」の世界観・攻略・データ事典（現行バージョン準拠）
site_url: https://crownfall-game.github.io/
# ゲーム本体のソース（Wiki 編集リンク用）。公開サイト本体は crownfall-game.github.io
repo_url: https://github.com/JeflyMarte/crownfall
repo_name: crownfall
edit_uri: edit/main/wiki/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: ja
  palette:
    - scheme: slate
      primary: amber
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: ライトモードへ
    - scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: ダークモードへ
  font:
    text: Noto Sans JP
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    logo: material/crown

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - ja

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/crownfall-game
    - icon: material/crown
      link: /

nav:
  - ホーム: index.md
  - プレイヤー向け:
      - どんなゲーム？: guide/what-is.md
      - よくある質問: guide/faq.md
      - 初心者向けガイド: guide/beginner.md
      - キャラを強くするには: guide/power-up.md
      - 稼ぎ方: guide/farming.md
      - 招待状（ガチャ）: guide/gacha.md
      - オトモ: guide/pets.md
      - キャラTierランク: guide/tier.md
      - 要注意敵: guide/threats.md
      - Boss攻略まとめ: guide/bosses.md
      - 放浪敵一覧: guide/wandering.md
      - Hard／Nightmare: guide/hard-nightmare.md
      - ビルド構成例: guide/builds.md
      - おすすめ装備: guide/recommended-gear.md
      - 用語集（プレイヤー版）: guide/glossary-player.md
      - UI案内: guide/ui-guide.md
      - 更新履歴: guide/changelog.md
  - 攻略:
      - はじめに: guide/getting-started.md
      - 拠点ガイド: guide/hub.md
      - 進行とダンジョン: guide/progression.md
      - モーンゲート攻略: guide/mourngate.md
      - ウィスパーウッド攻略: guide/whisperwood.md
      - ミストフェン攻略: guide/mistfen.md
      - ブラックショア攻略: guide/blackshore.md
      - フロストリッジ攻略: guide/frostridge.md
      - イベントダンジョン: guide/events.md
      - 深層攻略: guide/abyss.md
      - 戦闘の仕組み: guide/combat.md
      - 属性と状態異常: guide/elements.md
      - 装備と鍛冶: guide/equipment.md
  - データ:
      - モンスター図鑑: data/monsters.md
      - 武器一覧: data/weapons.md
      - 防具・装飾品: data/equipment.md
      - ジョブ: data/jobs.md
      - スキル一覧: data/skills.md
      - ダンジョンデータ: data/dungeons.md
  - 世界観:
      - 概要: world/overview.md
      - 歴史: world/history.md
      - 九王: world/characters.md
      - 九英雄: world/heroes.md
      - 地理: world/geography.md
      - 社会と派閥: world/society.md
      - 探索者ギルド: world/guild.md
      - 信仰と死生観: world/faith.md
      - 古代種と伝説個体: world/legends.md
      - 王遺産（遺物）: world/relics.md
      - 断片ロア: world/fragments.md
      - 用語集: world/glossary.md
