# Crownfall 攻略Wiki → https://crownfall-game.github.io/
#
# 本番は Org の crownfall-game.github.io（ユーザーサイト）へ載せる。
# 必要: リポジトリ Secrets に WIKI_PAGES_TOKEN
#   （classic PAT: repo スコープ、または fine-grained で
#    crownfall-game/crownfall-game.github.io の Contents: Read and write）

name: Deploy Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-pages.yml"
  workflow_dispatch:

concurrency:
  group: wiki-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wiki/requirements.txt

      - name: Install MkDocs
        working-directory: wiki
        run: pip install -r requirements.txt

      - name: Build site
        working-directory: wiki
        run: mkdocs build --clean

      - name: Require deploy token
        env:
          WIKI_PAGES_TOKEN: ${{ secrets.WIKI_PAGES_TOKEN }}
        run: |
          if [ -z "$WIKI_PAGES_TOKEN" ]; then
            echo "::error::Secret WIKI_PAGES_TOKEN が未設定です。crownfall-game/crownfall-game.github.io へ write できる PAT を Settings → Secrets → Actions に追加してください。"
            exit 1
          fi

      - name: Deploy to crownfall-game.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.WIKI_PAGES_TOKEN }}
          external_repository: crownfall-game/crownfall-game.github.io
          publish_branch: main
          publish_dir: ./wiki/site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy wiki from crownfall@${{ github.sha }}"
